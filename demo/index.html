<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>校园跑 Demo · 俯视校园 + 虚拟 GPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#07090a;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
  #game { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  .panel { position:absolute; background:rgba(4,7,9,.72); border-left:3px solid #f9c63a;
    backdrop-filter:blur(6px); padding:8px 12px 10px; border-radius:3px;
    box-shadow:0 6px 24px rgba(0,0,0,.55); }
  .panel h2 { font-size:10px; letter-spacing:.14em; color:#f9c63a; font-weight:700;
    text-transform:uppercase; margin-bottom:6px; white-space:nowrap; }
  .row { display:flex; justify-content:space-between; gap:18px; font-size:12px; line-height:1.65; white-space:nowrap; }
  .row .k { color:#7d8a86; letter-spacing:.06em; }
  .row .v { font-weight:700; color:#eef3f1; font-variant-numeric:tabular-nums; }
  .v.good { color:#71e88a; } .v.bad { color:#ff6b5a; } .v.warn { color:#ffb84d; } .v.dim { color:#8d9a96; }

  #pLeft  { left:12px; top:12px; width:250px; }
  #pRight { right:12px; top:12px; width:292px; }
  #pTop   { left:50%; top:12px; transform:translateX(-50%); width:246px; padding-bottom:12px; }
  #pBottom{ left:12px; bottom:12px; width:auto; max-width:calc(100% - 260px); border-left-color:#3fd6ff; }

  #json { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size:10.5px;
    color:#8fd8ff; background:rgba(0,0,0,.45); border-radius:3px; padding:6px 7px; margin-top:7px;
    white-space:pre-wrap; word-break:break-all; line-height:1.45; max-height:74px; overflow:hidden; }

  .bar { height:4px; background:rgba(255,255,255,.13); border-radius:2px; margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#71e88a; transition:width .25s; }

  #hint { font-size:11.5px; color:#8d9a96; line-height:1.7; }
  #hint b { color:#eef3f1; }
  .kbd { display:inline-block; padding:1px 5px; border:1px solid #3a4644; border-radius:3px;
    background:#141a1b; color:#cfd8d5; font-size:10.5px; font-family:inherit; }

  #speeds { position:absolute; right:12px; bottom:12px; display:flex; gap:5px; align-items:center;
    background:rgba(4,7,9,.72); padding:6px 9px; border-radius:3px; border-left:3px solid #3fd6ff; }
  #speeds span { font-size:10px; color:#7d8a86; margin-right:3px; letter-spacing:.08em; }
  #speeds button { font:inherit; font-size:11px; font-weight:700; padding:3px 9px; cursor:pointer;
    background:#141a1b; color:#9aa7a3; border:1px solid #2a3533; border-radius:3px; }
  #speeds button.on { background:#f9c63a; color:#10130f; border-color:#f9c63a; }
  #badge { font-size:9.5px; color:#ffb84d; margin-left:4px; letter-spacing:.05em; }
  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#7d8a86; font-size:13px; background:#07090a; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="boot">初始化中…</div>

<div class="panel" id="pLeft">
  <h2>Run Session · 跑步会话</h2>
  <div class="row"><span class="k">DISTANCE 里程</span><span class="v" id="vDist">0.000 km</span></div>
  <div class="row"><span class="k">PACE 配速</span><span class="v" id="vPace">--'--"</span></div>
  <div class="row"><span class="k">TIME 用时</span><span class="v" id="vTime">00:00</span></div>
  <div class="row"><span class="k">SPEED 速度</span><span class="v" id="vSpeed">0.00 m/s</span></div>
  <div class="row"><span class="k">AVG PACE 均配速</span><span class="v" id="vAvg">--'--"</span></div>
</div>

<div class="panel" id="pRight">
  <h2>GPS Feed → lpr_route.json</h2>
  <div class="row"><span class="k">LAT</span><span class="v" id="vLat">-</span></div>
  <div class="row"><span class="k">LON</span><span class="v" id="vLon">-</span></div>
  <div class="row"><span class="k">ACCURACY</span><span class="v" id="vAcc">-</span></div>
  <div class="row"><span class="k">SATELLITES</span><span class="v" id="vSat">-</span></div>
  <div class="row"><span class="k">BEARING</span><span class="v" id="vBrg">-</span></div>
  <div class="row"><span class="k">FIX #</span><span class="v" id="vFix">0</span></div>
  <div id="json">{}</div>
</div>

<div class="panel" id="pTop">
  <h2>Checkpoints · 打卡点</h2>
  <div class="row"><span class="k">已打卡</span><span class="v" id="vCp">0 / 0</span></div>
  <div class="bar"><i id="vCpBar"></i></div>
</div>

<div class="panel" id="pBottom">
  <div id="hint">
    <b id="vMode">手动模式</b> ·
    <span class="kbd">WASD</span> / 拖左半屏 移动 ·
    <span class="kbd">空格</span> 自动驾驶 ·
    <span class="kbd">T</span> 重置 ·
    <span class="kbd">滚轮</span> 缩放
  </div>
</div>

<div id="speeds">
  <span>演示加速<span id="badge"></span></span>
  <button data-s="1">1×</button>
  <button data-s="3">3×</button>
  <button data-s="6">6×</button>
  <button data-s="20">20×</button>
</div>

<script src="js/geo.js"></script>
<script src="js/campus.js"></script>
<script src="js/campus-suzhou.js"></script>
<script src="js/campus-demo.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
