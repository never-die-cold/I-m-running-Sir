  <button data-s="3">3×</button>
  <button data-s="6">6×</button>
  <button data-s="20">20×</button>
</div>

<script>
"use strict";

/* ============================================================
   1. 几何 / 地理  (与 unity/Assets/Scripts/Core/ 保持一致)
   ============================================================ */
const DEG = Math.PI / 180;

const V = {
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s}),
  len:a=>Math.hypot(a.x,a.y),
  norm:a=>{const l=Math.hypot(a.x,a.y); return l>1e-12?{x:a.x/l,y:a.y/l}:{x:0,y:0};},
  lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}),
  dist:(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),
  dot:(a,b)=>a.x*b.x+a.y*b.y,
  cross:(a,b)=>a.x*b.y-a.y*b.x
};

function metersPerDegLat(lat){const p=lat*DEG;
  return 111132.92-559.82*Math.cos(2*p)+1.175*Math.cos(4*p)-0.0023*Math.cos(6*p);}
function metersPerDegLon(lat){const p=lat*DEG;
  return 111412.84*Math.cos(p)-93.5*Math.cos(3*p)+0.118*Math.cos(5*p);}

const EARTH_R = 6371008.8;
function haversine(a,b){
  const la1=a.lat*DEG, la2=b.lat*DEG, dla=la2-la1, dlo=(b.lon-a.lon)*DEG;
  const s1=Math.sin(dla/2), s2=Math.sin(dlo/2);
  let h=s1*s1+Math.cos(la1)*Math.cos(la2)*s2*s2;
  if(h>1)h=1;
  return 2*EARTH_R*Math.asin(Math.sqrt(h));
}

class LocalFrame {
  constructor(origin){ this.origin=origin;
    this.mPerDegLat=metersPerDegLat(origin.lat);
    this.mPerDegLon=metersPerDegLon(origin.lat); }
  toLocal(p){ return { x:(p.lon-this.origin.lon)*this.mPerDegLon,
                       y:(p.lat-this.origin.lat)*this.mPerDegLat }; }
  toGeo(v){ return { lat:this.origin.lat+v.y/this.mPerDegLat,
                     lon:this.origin.lon+v.x/this.mPerDegLon }; }
}

/* 确定性随机 (mulberry32) —— 顺序与 C# 版不同，统计特性一致 */
function Rng(seed){
  let s = seed>>>0;
  this.next = function(){ s=(s+0x6D2B79F5)|0;
    let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296; };
  this.range = (a,b)=>a+(b-a)*this.next();
  this.int   = (a,b)=>a+Math.floor(this.next()*Math.max(1,b-a));
  this.gauss = function(){ let u1=this.next(), u2=this.next();
    if(u1<1e-12)u1=1e-12; return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); };
}

class Polyline {
  constructor(points, closed){
    if(points.length<2) throw new Error("need >=2 points");
    this.closed = !!closed;
    let pts = points.slice();
    if(this.closed && V.dist(pts[0], pts[pts.length-1])>1e-9) pts.push(pts[0]);
    this.pts = pts;
    this.cum = [0];
    for(let i=1;i<pts.length;i++) this.cum.push(this.cum[i-1]+V.dist(pts[i-1],pts[i]));
  }
  get length(){ return this.cum[this.cum.length-1]; }
  wrap(d){ const t=this.length; if(t<=1e-9) return 0;
    if(this.closed){ let v=d%t; if(v<0)v+=t; return v; }
    return Math.max(0, Math.min(t, d)); }
  segAt(d){ const c=this.cum; let lo=0, hi=c.length-1;
    while(lo<hi-1){ const m=(lo+hi)>>1; if(c[m]<=d) lo=m; else hi=m; }
    return Math.min(lo, this.pts.length-2); }
  pointAt(d){ const dd=this.wrap(d), s=this.segAt(dd);
    const a=this.cum[s], b=this.cum[s+1], t=b-a<=1e-12?0:(dd-a)/(b-a);
    return V.lerp(this.pts[s], this.pts[s+1], t); }
  tangentAt(d){ const s=this.segAt(this.wrap(d));
    const n=V.norm(V.sub(this.pts[s+1], this.pts[s]));
    return (n.x===0&&n.y===0)?{x:1,y:0}:n; }
}

/* 圆角矩形 / 标准田径场 —— 与 C# CampusLayout 对应 */
function roundedRect(min,max,r,seg){
  const out=[]; const arc=(cx,cy,from,to)=>{ for(let i=0;i<=seg;i++){
    const a=(from+(to-from)*i/seg)*DEG; out.push({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}); } };
  const x0=min.x,y0=min.y,x1=max.x,y1=max.y;
  const rr=Math.min(r, Math.min(x1-x0,y1-y0)/2);
  arc(x1-rr,y0+rr,-90,0); arc(x1-rr,y1-rr,0,90); arc(x0+rr,y1-rr,90,180); arc(x0+rr,y0+rr,180,270);
  return out;
}
function stadiumTrack(c,half,radius){
  const pts=[], steps=24;
  pts.push({x:c.x-half,y:c.y-radius}); pts.push({x:c.x+half,y:c.y-radius});
  for(let i=1;i<=steps;i++){ const a=(-90+180*i/steps)*DEG;
    pts.push({x:c.x+half+radius*Math.cos(a), y:c.y+radius*Math.sin(a)}); }
  pts.push({x:c.x-half,y:c.y+radius});
  for(let i=1;i<=steps;i++){ const a=(90+180*i/steps)*DEG;
    pts.push({x:c.x-half+radius*Math.cos(a), y:c.y+radius*Math.sin(a)}); }
  return new Polyline(pts,true);
}

/* ============================================================
   2. 校园布局  (镜像 unity/Assets/Scripts/Core/CampusLayout.cs)
   ============================================================ */
const ORIGIN = { lat:30.0000000, lon:120.0000000 };  // ← 占位，换成你学校的坐标

const BUILDING_COLORS = {
  library:[82,90,118], teach:[107,100,90], canteen:[122,102,74], dorm:[96,90,107],
  gym:[77,108,100], admin:[111,97,83], lab:[90,102,111]
};

const CAMPUS = (()=>{
  const outer = roundedRect({x:-360,y:-260},{x:360,y:260},70,8);
  const track = stadiumTrack({x:-230,y:150},42.195,36.5);
  return {
    name:"示例校园",
    roads:[
      {name:"北环路", pts:outer,        w:8,   closed:true},
      {name:"中轴路", pts:[{x:0,y:-260},{x:0,y:260}],               w:7, closed:false},
      {name:"东横路", pts:[{x:-360,y:0},{x:360,y:0}],               w:6, closed:false},
      {name:"西横路", pts:[{x:-360,y:150},{x:-140,y:150}],          w:5, closed:false},
      {name:"操场支路",pts:[{x:-140,y:150},{x:0,y:150}],            w:5, closed:false},
      {name:"东侧支路",pts:[{x:180,y:0},{x:180,y:150}],             w:5, closed:false},
      {name:"操场跑道",pts:track.pts,                               w:9, closed:true, isTrack:true}
    ],
    buildings:[
      {n:"图书馆", c:{x:90,y:150},  s:{x:90,y:70},  k:"library"},
      {n:"教学楼A",c:{x:180,y:-70}, s:{x:70,y:110}, k:"teach"},
      {n:"教学楼B",c:{x:270,y:-70}, s:{x:70,y:110}, k:"teach"},
      {n:"第二食堂",c:{x:-70,y:-180},s:{x:100,y:60},k:"canteen"},
      {n:"宿舍楼1",c:{x:-330,y:-190},s:{x:40,y:80}, k:"dorm"},
      {n:"宿舍楼2",c:{x:-280,y:-190},s:{x:40,y:80}, k:"dorm"},
      {n:"宿舍楼3",c:{x:-230,y:-190},s:{x:40,y:80}, k:"dorm"},
      {n:"体育馆", c:{x:230,y:190}, s:{x:100,y:80}, k:"gym"},
      {n:"行政楼", c:{x:40,y:215},  s:{x:80,y:50},  k:"admin"},
      {n:"实验楼", c:{x:-70,y:60},  s:{x:70,y:60},  k:"lab"}
    ],
    mainRoute: new Polyline(outer, true)
  };
})();

/* ============================================================
   3. 配速 / 抖动 / GPS  (与 C# Core 对应)
   ============================================================ */
class PaceController {
  constructor(seed){
    this.rng = new Rng(seed);
    this.minPace = 180;   // 3'00"/km  合法上限速度
    this.maxPace = 540;   // 9'00"/km  合法下限速度
    this.wanderRatio = 0.10;
    this.wanderTau = 25.0;
    this.responseTau = 3.0;
    this._w = 0; this._cur = 0;
  }
  get minSpeed(){ return 1000/this.maxPace; }
  get maxSpeed(){ return 1000/this.minPace; }
  get current(){ return this._cur; }
  reset(){ this._w = 0; this._cur = 0; }
  update(dt, desired){
    if(desired <= 0){ this._cur = 0; return {applied:0, stopped:true}; }
    if(dt <= 0) return {applied:this._cur, stopped:false};

    const decay = Math.exp(-dt/Math.max(1,this.wanderTau));
    const drive = Math.sqrt(Math.max(0, 1-decay*decay));
    this._w = this._w*decay + drive*this.rng.gauss();

    let target = desired * (1 + this._w*this.wanderRatio);
    let cLow=false, cHigh=false;
    if(target < this.minSpeed){ target=this.minSpeed; cLow=true; }
    else if(target > this.maxSpeed){ target=this.maxSpeed; cHigh=true; }

    if(this._cur <= 1e-6){ this._cur = target; }
    else {
      const a = 1-Math.exp(-dt/Math.max(0.1,this.responseTau));
      this._cur += (target-this._cur)*a;
    }
    return {applied:this._cur, stopped:false, clampedLow:cLow, clampedHigh:cHigh};
  }
}

/* Ornstein-Uhlenbeck 过程：时间相关的漂移，避免白噪声被 FFT 识别 */
class JitterNoise {
  constructor(amp, tau, seed){
    this.amp=amp; this.tau=tau; this.rng=new Rng(seed); this._s={x:0,y:0};
  }
  reset(){ this._s={x:0,y:0}; }
  update(dt){
    if(dt<=0) return this._s;
    const decay=Math.exp(-dt/this.tau);
    const drive=this.amp*Math.sqrt(2/this.tau)*Math.sqrt(Math.max(0,1-decay*decay));
    this._s={ x:this._s.x*decay+drive*this.rng.gauss(),
              y:this._s.y*decay+drive*this.rng.gauss() };
    return this._s;
  }
}

class GpsFeed {
  constructor(frame, seed){
    this.frame=frame;
    this.jitter=new JitterNoise(3.0, 12.0, seed^0xA5A5A5A5);
    this.rng=new Rng(seed^0x5A5A5A5A);
    this.pace=new PaceController(seed^0x3C3C3C3C);
    this.reset();
    this.accMin=5.5; this.accMax=12.0; this.accTau=8.0;
    this.altitude=15.0; this.bearingNoise=3.0; this.speedTau=4.0;
  }
  reset(){
    this._lastTrue=null; this._speed=0; this._bearing=0; this._acc=8.0;
    this.seq=0; this.nanos=0; this.jitter.reset(); this.pace.reset();
  }
  build(dt, trueLocal, velocity, wallMs){
    if(dt<0) dt=0;

    let step=0;
    if(this._lastTrue && dt>1e-6) step=V.dist(trueLocal,this._lastTrue);
    const instant = dt>1e-6 ? step/dt : 0;

    if(this._speed<=0 && instant>0) this._speed=instant;
    else { const a = dt<=0?1:1-Math.exp(-dt/Math.max(0.2,this.speedTau));
           this._speed += (instant-this._speed)*a; }
    if(this._speed<0.15) this._speed=0;

    const off = this.jitter.update(dt);
    const reported = { x:trueLocal.x+off.x, y:trueLocal.y+off.y };

    if(this._speed>0.35){
      let dir=V.norm(velocity);
      if(dir.x===0&&dir.y===0 && this._lastTrue) dir=V.norm(V.sub(trueLocal,this._lastTrue));
      if(dir.x!==0||dir.y!==0){
        const tb=(Math.atan2(dir.y,dir.x)*180/Math.PI+360)%360;
        let diff=tb-this._bearing;
        while(diff>180)diff-=360; while(diff<-180)diff+=360;
        const ba = dt<=0?1:1-Math.exp(-dt/2.0);
        this._bearing=((this._bearing+diff*ba)%360+360)%360;
      }
    }

    const aa = dt<=0?1:1-Math.exp(-dt/Math.max(0.5,this.accTau));
    this._acc += (this.rng.range(this.accMin,this.accMax)-this._acc)*aa;

    const geo = this.frame.toGeo(reported);
    this._lastTrue = trueLocal;
    this.nanos += Math.round(dt*1e9);

    const fix = {
      lat: geo.lat, lon: geo.lon, timeMs: wallMs, elapsedRealtimeNanos: this.nanos,
      accuracy: this._acc, speed: this._speed,
      bearing: ((this._bearing + this.rng.range(-this.bearingNoise,this.bearingNoise))%360+360)%360,
      altitude: this.altitude + this.rng.range(-4,4),
      satellites: this.rng.int(7,13), provider:"gps"
    };
    this.seq++;
    return fix;
  }
}

/* ============================================================
   4. 跑步会话
   ============================================================ */
class RunSession {
  constructor(frame, campus, seed){
    this.frame=frame; this.campus=campus; this.rng=new Rng(seed^0x1234567);
    this.feed=new GpsFeed(frame, seed);
    this.route=campus.mainRoute;
    this.fixInterval=1.0;

    this.worldPos={x:0,y:0}; this.velocity={x:0,y:0};
    this.routeDist=0; this.trueDist=0; this.recordedDist=0; this.duration=0;
    this.isRunning=true; this.fixCount=0;
    this.maxAcc=35; this.maxSpeedAccepted=8;
    this.checkpointRadius=80;
    this.checkpoints=[];
    this.lastFix=this.feed.build(0,{x:0,y:0},{x:0,y:0},Date.now());

    this._lastTrueLocal=null; this._lastAccepted=null; this._fixAcc=0;
  }

  resetToRouteStart(){
    this.routeDist=0;
    this.worldPos=this.route.pointAt(0);
    this.velocity={x:0,y:0};
    this._resetCounters();
  }
  _resetCounters(){
    this.trueDist=0; this.recordedDist=0; this.duration=0; this.fixCount=0;
    this._lastTrueLocal=null; this._lastAccepted=null; this._fixAcc=0;
    this.feed.reset();
  }
  startRun(){ this.isRunning=true; this.duration=0; this._lastAccepted=null; this.feed.pace.reset(); }

  spawnCheckpoints(count, radius, minSep, startExclusion){
    const total=this.route.length;
    const lo=startExclusion*total, hi=total*0.98;
    const picked=[]; let guard=0;
    while(picked.length<count && guard<4000){
      guard++;
      const d=this.rng.range(lo,hi);
      if(picked.every(p=>Math.abs(p-d)>=minSep)) picked.push(d);
    }
    picked.sort((a,b)=>a-b);
    this.checkpoints = picked.map((d,i)=>({
      index:i, routeDistance:d, localMeters:this.route.pointAt(d),
      radius:radius, cleared:false
    }));
  }

  updateCheckpoints(fix){
    let n=0;
    for(const cp of this.checkpoints){
      if(cp.cleared) continue;
      const geo=this.frame.toGeo(cp.localMeters);
      if(haversine({lat:fix.lat,lon:fix.lon}, geo) <= cp.radius){ cp.cleared=true; n++; }
    }
    return n;
  }

  tick(dt, wallMs, direction, baseSpeed){
    if(dt<0) dt=0;
    if(this.isRunning) this.duration += dt;

    const ps=this.feed.pace.update(dt, this.isRunning?baseSpeed:0);
    const dir=V.norm(direction);
    const speed=(dir.x===0&&dir.y===0)?0:ps.applied;

    this.velocity={x:dir.x*speed, y:dir.y*speed};
    const next=V.add(this.worldPos, V.mul(this.velocity,dt));
    return this._commit(dt, wallMs, next);
  }

  tickAutopilot(dt, wallMs, baseSpeed){
    if(dt<0) dt=0;
    if(this.isRunning) this.duration += dt;

    const ps=this.feed.pace.update(dt, this.isRunning?baseSpeed:0);
    this.routeDist += ps.applied*dt;
    const pos=this.route.pointAt(this.routeDist);
    this.velocity=V.mul(this.route.tangentAt(this.routeDist), ps.applied);
    return this._commit(dt, wallMs, pos);
  }

  _commit(dt, wallMs, nextWorld){
    const nextLocal=nextWorld;

    if(this._lastTrueLocal) this.trueDist += V.dist(nextLocal, this._lastTrueLocal);
    this._lastTrueLocal=nextLocal;
    this.worldPos=nextWorld;

    this._fixAcc += dt;
    if(this.fixCount>0 && this._fixAcc < this.fixInterval) return this.lastFix;

    const fixDt=this._fixAcc; this._fixAcc=0;

    const fix=this.feed.build(fixDt, nextLocal, this.velocity, wallMs);

    if(this.isRunning && fix.accuracy<=this.maxAcc){
      const cur={lat:fix.lat, lon:fix.lon};
      if(!this._lastAccepted){ this._lastAccepted=cur; }
      else {
        const step=haversine(this._lastAccepted,cur);
        const implied = fixDt>1e-6 ? step/fixDt : 999;
        if(implied<=this.maxSpeedAccepted){ this.recordedDist += step; this._lastAccepted=cur; }
      }
    }

    this.updateCheckpoints(fix);
    this.fixCount++;
    this.lastFix=fix;
    return fix;
  }
}

/* ============================================================
   5. 渲染
   ============================================================ */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, 2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

let cam={x:0,y:0,zoom:0.42};
const CAM_MIN=0.14, CAM_MAX=2.2;
function w2s(x,y){ return [ (x-cam.x)*cam.zoom + W/2, H/2 - (y-cam.y)*cam.zoom ]; }

function draw(){
  ctx.fillStyle="#07090a"; ctx.fillRect(0,0,W,H);

  const z=cam.zoom;
  const halfW=W/2/z, halfH=H/2/z;
  const L=cam.x-halfW, R=cam.x+halfW, Bo=cam.y-halfH, T=cam.y+halfH;

  drawGroundGrid(L,R,Bo,T,z);
  for(const rd of CAMPUS.roads){ if(rd.isTrack) continue; drawRibbon(rd.pts, rd.w, "#3b3f45", rd.closed); }
  drawRibbon(CAMPUS.mainRoute.pts, 1.8, "rgba(249,198,58,.30)", true, [5,6]);
  for(const rd of CAMPUS.roads){ if(rd.isTrack) drawRibbon(rd.pts, rd.w, "#8a4a32", rd.closed); }
  for(const b of CAMPUS.buildings) drawBuilding(b);
  drawCheckpoints();
  drawPlayer();
}

function drawGroundGrid(L,R,Bo,T,z){
  ctx.fillStyle="#11150f"; ctx.fillRect(0,0,W,H);
  const step = z<0.3?200 : z<0.7?100 : 50;
  if(step*z < 22) return;
  ctx.strokeStyle="rgba(255,255,255,.030)"; ctx.lineWidth=1; ctx.beginPath();
  const x0=Math.ceil(L/step)*step, y0=Math.ceil(Bo/step)*step;
  for(let x=x0;x<=R;x+=step){ const s=w2s(x,0); ctx.moveTo(s[0],0); ctx.lineTo(s[0],H); }
  for(let y=y0;y<=T;y+=step){ const s=w2s(0,y); ctx.moveTo(0,s[1]); ctx.lineTo(W,s[1]); }
  ctx.stroke();
}

function drawRibbon(pts, width, color, closed, dash){
  ctx.save();
  ctx.lineWidth=Math.max(1, width*cam.zoom);
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=color;
  if(dash) ctx.setLineDash(dash.map(d=>d*cam.zoom));
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){ const s=w2s(pts[i].x,pts[i].y); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }
  if(closed) ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawBuilding(b){
  const c=BUILDING_COLORS[b.k]||[100,100,100];
  const [x,y]=w2s(b.c.x+b.s.x/2, b.c.y+b.s.y/2);
  const w=b.s.x*cam.zoom, h=b.s.y*cam.zoom;
  const rx=x-w, ry=y;

  ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
  ctx.fillRect(rx,ry,w,h);
  ctx.fillStyle=`rgba(255,255,255,.10)`;
  ctx.fillRect(rx,ry,w,Math.max(1,h*0.14));
  ctx.strokeStyle=`rgba(0,0,0,.45)`; ctx.lineWidth=1;
  ctx.strokeRect(rx+.5,ry+.5,w-1,h-1);

  if(w>62 && h>18){
    ctx.fillStyle="rgba(235,242,240,.72)";
    ctx.font=`${Math.min(12,Math.max(9,h*0.24))}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(b.n, rx+w/2, ry+h/2);
  }
}

let T0=performance.now()/1000;
function drawCheckpoints(){
  const pulse=(Math.sin((performance.now()/1000-T0)*3)+1)/2;
  for(const cp of session.checkpoints){
    const [x,y]=w2s(cp.localMeters.x, cp.localMeters.y);
    const r=cp.radius*cam.zoom;
    if(x<-r-40||x>W+r+40||y<-r-40||y>H+r+40) continue;

    ctx.save();
    if(cp.cleared){
      ctx.strokeStyle="rgba(120,130,126,.4)"; ctx.setLineDash([4,5]); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
      ctx.fillStyle="rgba(120,130,126,.65)";
      ctx.font="11px sans-serif"; ctx.textAlign="center";
      ctx.fillText("已打卡", x, y+4);
    } else {
      const a=0.20+pulse*0.20;
      ctx.fillStyle=`rgba(63,214,255,${a*0.5})`;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      ctx.strokeStyle=`rgba(63,214,255,${a+0.45})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(63,214,255,.95)"; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(x,y,r*(0.55+0.25*pulse),0,7); ctx.stroke();
      ctx.fillStyle="#3fd6ff";
      ctx.font="bold 11px sans-serif"; ctx.textAlign="center";
      ctx.fillText("打卡点 "+(cp.index+1), x, y-r-8);
    }
    ctx.restore();
  }
}

function drawPlayer(){
  const [x,y]=w2s(session.worldPos.x, session.worldPos.y);
  const f=session.lastFix;
  const dir = (f && f.speed>0.35)
    ? { x:Math.sin(f.bearing*DEG), y:Math.cos(f.bearing*DEG) }
    : { x:0, y:-1 };

  ctx.save();
  const g=ctx.createRadialGradient(x,y,2,x,y,34);
  g.addColorStop(0,"rgba(249,198,58,.42)"); g.addColorStop(1,"rgba(249,198,58,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,34,0,7); ctx.fill();

  ctx.strokeStyle="rgba(249,198,58,.35)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.stroke();

  ctx.fillStyle="#f9c63a";
  ctx.beginPath(); ctx.arc(x,y,6.2,0,7); ctx.fill();
  ctx.fillStyle="#1b1d18";
  ctx.beginPath(); ctx.arc(x+dir.x*2.6, y-dir.y*2.6, 2.6, 0, 7); ctx.fill();

  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x+dir.x*22, y-dir.y*22); ctx.stroke();
  ctx.restore();
}

/* ============================================================
   6. 输入
   ============================================================ */
const keys={};
window.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space"){ e.preventDefault(); boot.autopilot=!boot.autopilot; }
  if(e.code==="KeyT"){ resetRun(); }
  if(e.code==="Equal"||e.code==="NumpadAdd"){ cam.zoom=Math.min(CAM_MAX,cam.zoom*1.18); }
  if(e.code==="Minus"||e.code==="NumpadSubtract"){ cam.zoom=Math.max(CAM_MIN,cam.zoom/1.18); }
});
window.addEventListener("keyup",e=>{ keys[e.code]=false; });
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  cam.zoom=Math.max(CAM_MIN,Math.min(CAM_MAX, cam.zoom*(e.deltaY<0?1.12:1/1.12)));
},{passive:false});

const joy={ active:false, id:null, ox:0, oy:0, x:0, y:0 };
function canvasPos(e){
  const r=cv.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}
cv.addEventListener("pointerdown",e=>{
  if(e.clientX - cv.getBoundingClientRect().left > W*0.55) return;
  joy.active=true; joy.id=e.pointerId;
  const p=canvasPos(e); joy.ox=p.x; joy.oy=p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  if(!joy.active||e.pointerId!==joy.id) return;
  const p=canvasPos(e);
  const R=Math.min(W,H)*0.13;
  let dx=(p.x-joy.ox)/R, dy=-(p.y-joy.oy)/R;
  const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  joy.x=dx; joy.y=dy;
});
function endJoy(e){ if(e.pointerId===joy.id){ joy.active=false; joy.id=null; joy.x=0; joy.y=0; } }
cv.addEventListener("pointerup",endJoy);
cv.addEventListener("pointercancel",endJoy);

function readInput(){
  let x=0,y=0;
  if(keys.KeyW||keys.ArrowUp) y+=1;
  if(keys.KeyS||keys.ArrowDown) y-=1;
  if(keys.KeyD||keys.ArrowRight) x+=1;
  if(keys.KeyA||keys.ArrowLeft) x-=1;
  if(x||y){ const m=Math.hypot(x,y); return {x:x/m,y:y/m}; }
  if(joy.x||joy.y) return {x:joy.x,y:joy.y};
  return {x:0,y:0};
}

function drawJoystick(){
  const R=Math.min(W,H)*0.13;
  const ox=joy.active?joy.ox:W*0.16, oy=joy.active?joy.oy:H*0.78;
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,.20)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ox,oy,R,0,7); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.10)";
  ctx.beginPath(); ctx.arc(ox,oy,R*0.45,0,7); ctx.stroke();
  ctx.fillStyle = (joy.x||joy.y)?"rgba(249,198,58,.8)":"rgba(255,255,255,.32)";
  ctx.beginPath(); ctx.arc(ox+joy.x*R, oy-joy.y*R, R*0.30, 0, 7); ctx.fill();
  ctx.restore();
}

/* ============================================================
   7. 主循环
   ============================================================ */
const frame = new LocalFrame(ORIGIN);
let session, boot;

function resetRun(){
  session.resetToRouteStart();
  session.spawnCheckpoints(3, 80, 120, 0.15);
  session.startRun();
  boot.autopilot=false;
  cam.x=session.worldPos.x; cam.y=session.worldPos.y;
}

function init(){
  session = new RunSession(frame, CAMPUS, 20260924);
  boot = { autopilot:false, speedMul:6, targetSpeed:2.94, lastTime:performance.now()/1000 };

  resetRun();

  resize();
  document.getElementById("boot").remove();

  const btns=[...document.querySelectorAll("#speeds button")];
  const badge=document.getElementById("badge");
  function setSpeed(mult){
    boot.speedMul=mult;
    btns.forEach(b=>b.classList.toggle("on", +b.dataset.s===mult));
    badge.textContent = mult===1 ? "（实机固定 1×）" : `（实机固定 1×，此处仅演示）`;
  }
  btns.forEach(b=>b.addEventListener("click",()=>setSpeed(+b.dataset.s)));
  setSpeed(6);

  requestAnimationFrame(loop);
}

const $=id=>document.getElementById(id);

function loop(nowMs){
  const now=nowMs/1000;
  let realDt=Math.min(0.05, now-boot.lastTime);
  boot.lastTime=now;

  const dt = realDt * boot.speedMul;
  const wallMs = Date.now();

  if(boot.autopilot) session.tickAutopilot(dt, wallMs, boot.targetSpeed);
  else session.tick(dt, wallMs, readInput(), boot.targetSpeed);

  const k=1-Math.exp(-realDt*6);
  cam.x += (session.worldPos.x-cam.x)*k;
  cam.y += (session.worldPos.y-cam.y)*k;

  draw();
  drawJoystick();
  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  const s=session, f=s.lastFix;
  const pace = f.speed>1e-6 ? 1000/f.speed : 0;
  const avgSpeed = s.duration>1 ? s.recordedDist/s.duration : 0;
  const avgPace = avgSpeed>1e-6 ? 1000/avgSpeed : 0;

  $("vDist").textContent = (s.recordedDist/1000).toFixed(3)+" km";
  $("vPace").textContent = fmtPace(pace);
  $("vTime").textContent = fmtDur(s.duration);
  $("vSpeed").textContent = f.speed.toFixed(2)+" m/s";

  const el=$("vAvg");
  let st, cls;
  if(s.duration<25){ st="--"; cls="dim"; }
  else if(avgSpeed < s.feed.pace.minSpeed){ st="TOO SLOW 太慢"; cls="bad"; }
  else if(avgSpeed > s.feed.pace.maxSpeed){ st="TOO FAST 太快"; cls="warn"; }
  else { st="OK 合法"; cls="good"; }
  el.textContent = fmtPace(avgPace)+"  "+st;
  el.className="v "+cls;

  $("vLat").textContent = f.lat.toFixed(7);
  $("vLon").textContent = f.lon.toFixed(7);
  $("vAcc").textContent = f.accuracy.toFixed(1)+" m";
  $("vSat").textContent = f.satellites;
  $("vBrg").textContent = f.bearing.toFixed(1)+"°";
  $("vFix").textContent = s.fixCount+" @1Hz";

  const cleared = s.checkpoints.filter(c=>c.cleared).length;
  $("vCp").textContent = cleared+" / "+s.checkpoints.length;
  $("vCpBar").style.width = (s.checkpoints.length? cleared/s.checkpoints.length*100:0)+"%";

  $("vMode").textContent = boot.autopilot?"自动驾驶中":"手动模式";
  $("json").textContent = JSON.stringify({
    v:1, seq:s.feed.seq, active:true, running:s.isRunning,
    distanceMeters:+s.recordedDist.toFixed(2), durationSeconds:+s.duration.toFixed(1),
    paceSecPerKm:+pace.toFixed(1), updatedAtMs:f.timeMs,
    fix:{ lat:+f.lat.toFixed(7), lon:+f.lon.toFixed(7), timeMs:f.timeMs,
          elapsedRealtimeNanos:f.elapsedRealtimeNanos, accuracy:+f.accuracy.toFixed(2),
          speed:+f.speed.toFixed(3), bearing:+f.bearing.toFixed(2),
          altitude:+f.altitude.toFixed(2), satellites:f.satellites, provider:"gps" }
  });
}

function fmtPace(sec){
  if(!sec||!isFinite(sec)||sec<=0) return "--'--\"";
  const t=Math.round(sec);
  return String(Math.floor(t/60)).padStart(2,"0")+"'"+String(t%60).padStart(2,"0")+"\"";
}
function fmtDur(sec){
  const t=Math.max(0,Math.floor(sec));
  const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

init();
</script>
